# Auto-release on push to main.
# Decides whether to release, and the bump type, in this order:
#   1. workflow_dispatch always releases with the chosen bump_type, including
#      in the template repo itself. dry_run previews the next version and AI
#      release notes without tagging or publishing.
#   2. A push to jedwards1230/template-repo itself never releases. Nothing
#      consumes the template's tags ("Use this template" copies the default
#      branch, not a tag); cut one deliberately with workflow_dispatch.
#   3. A push that created the branch (`created`, or an all-zero `before`
#      SHA) never releases: nothing was merged. This covers the first push of
#      a repo generated from this template.
#   4. A root commit (no parents) never releases, whatever the push payload
#      says. A generated repo starts with a single parentless commit. If the
#      commit lookup fails, the run warns and carries on with the
#      merged-PR lookup (rules 5-6).
#   5. The merged PR's labels decide: the first exact match of semver:major,
#      semver:minor, semver:patch, semver:none (in that order) wins.
#      semver:none skips the release; no semver:* label releases as patch.
#   6. No merged PR found for the commit (a direct push, or the PR is still
#      not indexed after 3 attempts): patch release, with a ::warning::.
# When a release is due, it calls release.yml, which tags and publishes a
# GitHub Release via the shared
# jedwards1230/release-workflows/.github/workflows/ai-release.yml@v1 workflow.
# See jedwards1230/release-workflows for documentation.

name: Auto Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Auto Release: {0}{1}',
           inputs.dry_run && 'dry-run ' || '',
           inputs.bump_type)
      || format('Auto Release: {0}', github.event.head_commit.message || github.sha)
  }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Dry run — compute version and preview notes without tagging or publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  detect:
    name: Detect bump type
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.bump.outputs.release }}
      bump_type: ${{ steps.bump.outputs.type }}
      dry_run: ${{ steps.bump.outputs.dry_run }}
    steps:
      - name: Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP_TYPE: ${{ inputs.bump_type }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          PUSH_CREATED: ${{ github.event.created }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Rule 1: workflow_dispatch uses the provided inputs and always
          # releases, in the template repo too.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            {
              echo "release=true"
              echo "type=${INPUT_BUMP_TYPE}"
            } >> "$GITHUB_OUTPUT"
            if [ "${INPUT_DRY_RUN}" = "true" ]; then
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Dry run: previewing release with bump_type=${INPUT_BUMP_TYPE}"
            else
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

          # Every push decision below ends in one of these two.
          no_release() {
            echo "::notice::$1"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          release_as() {
            {
              echo "release=true"
              echo "type=$1"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Rule 2: the template repo itself does not release on push.
          if [ "${GH_REPO}" = "jedwards1230/template-repo" ]; then
            no_release "The template repo does not release on push; run this workflow via workflow_dispatch to cut a release deliberately"
          fi

          # Rule 3: a push that created the branch merged nothing.
          if [ "${PUSH_CREATED}" = "true" ] || [[ "${PUSH_BEFORE}" =~ ^0+$ ]]; then
            no_release "This push created the branch (e.g. a generated repo's first push); nothing was merged, skipping the release"
          fi

          # Rule 4: a root commit merged nothing, whatever the payload says.
          # A failed lookup must not turn into a silent skip of a real merge,
          # so warn and fall through to the PR lookup instead. `arrays` keeps
          # a missing parents field from reading as 0.
          PARENTS=$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}" --jq '.parents | arrays | length') || PARENTS=""
          if [[ "${PARENTS}" =~ ^[0-9]+$ ]]; then
            if [ "${PARENTS}" -eq 0 ]; then
              no_release "${GITHUB_SHA} is a root commit (e.g. a generated repo's initial commit); nothing was merged, skipping the release"
            fi
          else
            echo "::warning::Could not read the parent count of ${GITHUB_SHA} (got '${PARENTS}'); continuing with the merged-PR lookup"
          fi

          # Rules 5-6: read the merged PR's labels. Retry only while the PR
          # isn't indexed yet (common after fresh merges). If the PR is found
          # but has no labels, that's an immediate patch; no point sleeping.
          LABELS=""
          PR_FOUND=""
          for attempt in 1 2 3; do
            PR_FOUND=$(gh pr list --state merged --base main --limit 100 \
              --json number,labels,mergeCommit \
              | jq -c --arg sha "$GITHUB_SHA" \
                '[.[] | select(.mergeCommit.oid == $sha)] | first // empty' \
                2>/dev/null || echo "")
            if [ -n "$PR_FOUND" ]; then
              LABELS=$(jq -r '.labels[]?.name // empty' <<< "$PR_FOUND" 2>/dev/null || echo "")
              break
            fi
            echo "Attempt ${attempt}: merged PR for ${GITHUB_SHA} not yet indexed, retrying in 5s..."
            sleep 5
          done

          # Rule 6: no PR means no labels to read; never a silent skip.
          if [ -z "$PR_FOUND" ]; then
            echo "::warning::No merged PR matched ${GITHUB_SHA} after 3 attempts; cannot read semver labels, defaulting to a patch release"
            release_as patch
          fi

          PR=$(jq -r '.number' <<< "$PR_FOUND")
          # One line: a label printed at line start could act as a workflow command.
          echo "PR #${PR} labels: $(paste -sd, - <<< "${LABELS:-<none>}")"

          # Rule 5: the first exact semver:* match wins, in this order.
          for t in major minor patch none; do
            if grep -qxF "semver:${t}" <<< "$LABELS"; then
              if [ "$t" = none ]; then
                no_release "PR #${PR} is labelled semver:none; skipping the release"
              fi
              echo "::notice::PR #${PR} is labelled semver:${t}; releasing as ${t}"
              release_as "$t"
            fi
          done
          echo "::notice::PR #${PR} has no semver:* label; releasing as patch"
          release_as patch

  release:
    name: Release
    needs: [detect]
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      bump_type: ${{ needs.detect.outputs.bump_type }}
      dry_run: ${{ needs.detect.outputs.dry_run == 'true' }}
    secrets: inherit
